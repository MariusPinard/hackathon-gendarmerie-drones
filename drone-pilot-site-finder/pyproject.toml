[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "drone-pilot-site-finder"
version = "0.4.0"
description = "Evidence-based candidate drone pilot zones from open geographic data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx2>=2.13,<3",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "pyproj>=3.7,<4",
    "rasterio>=1.4,<2",
    "scipy>=1.15,<2",
    "shapely>=2.1,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/drone_site_finder"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["drone_site_finder"]
